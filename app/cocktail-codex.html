/* Layout: a bar staff's spec book. Flip cards (sketched glass on the front, spec on the back) in a swipe deck or grid; one sheet for adding and editing. */
:root {
  /* Always dark: the app keeps its night look in every theme. */
  --bg: #111312;
  --paper: #1A1D1B;
  --paper-2: #212522;
  --ink: #E9ECE8;
  --muted: #9AA39D;
  --line: #2F3532;
  --accent: #7CC2A6;
  --accent-fg: #0E1A15;
  --danger: #EE7B83;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35);
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 96px; }

header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 7vw, 2.9rem); line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand h1 em { font-weight: 500; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

.seg { display: inline-flex; background: var(--paper-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }

.search { margin-top: 18px; position: relative; }
.search input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); font-size: 1rem; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 4px; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--paper); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: .9rem; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: .75rem; opacity: .65; margin-left: 4px; }

.status { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; color: var(--muted); font-size: .85rem; min-height: 28px; }

/* Deck (swipe) view */
.deck { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 18px 16px 20px; scroll-padding-inline: 16px; scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.deck .card { flex: 0 0 min(84vw, 340px); scroll-snap-align: start; height: min(560px, 72vh); min-height: 440px; }
.deck-nav { display: flex; justify-content: center; align-items: center; gap: 14px; color: var(--muted); font: .8rem var(--f-mono); }
.deck-nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 1.1rem; }

/* Grid view */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding-top: 18px; }
.grid .card { height: 300px; }
.grid .face { border-radius: 16px; }
.grid .pic svg { width: 58%; }
.grid .section-tag { top: 10px; left: 10px; right: 40px; font-size: .58rem; }
.grid .fav { top: 2px; right: 2px; width: 34px; height: 34px; }
.grid .fav svg { width: 18px; height: 18px; }
.grid .check-dot { top: auto; bottom: 8px; right: 8px; font-size: .56rem; padding: 2px 6px; }
.grid .glass-name { display: none; }
.grid .front-meta { padding: 10px 12px 12px; }
.grid .front-meta h2 { font-size: 1.1rem; }
.grid .front-meta .sub { display: none; }
.grid .back-head { padding: 8px 10px; gap: 6px; }
.grid .back-head svg.mini { width: 26px; height: 34px; }
.grid .back-head h3 { font-size: 1rem; }
.grid .back-head .sub { display: none; }
.grid .back-body { padding: 10px 12px 6px; }
.grid .ing li { grid-template-columns: 3.9em 1fr; gap: 6px; padding: 4px 0; font-size: .8rem; }
.grid .amt { font-size: .74rem; }
.grid .steps, .grid .facts, .grid .note, .grid .check ul { font-size: .78rem; }
.grid .check { padding: 8px 10px; }
.grid .back-foot { padding: 4px 6px; }
.grid .back-foot .btn-quiet { font-size: .75rem; padding: 6px; }

/* Flip card */
.card { perspective: 1400px; position: relative; }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform .6s cubic-bezier(.2,.75,.25,1); transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; }
.back { transform: rotateY(180deg); }
@media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }

.front, .back { cursor: pointer; }
.pic { flex: 1; min-height: 0; display: grid; place-items: center; position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, color-mix(in srgb, var(--line) 55%, transparent) 27px 28px); }
.pic svg { width: 62%; max-width: 200px; height: auto; max-height: 88%; }
.glass-name { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font: italic 500 .85rem var(--f-display); color: var(--muted); }
.section-tag { position: absolute; top: 14px; left: 14px; right: 52px; text-transform: uppercase; letter-spacing: .1em; font-size: .68rem; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.front-meta { padding: 14px 18px 18px; border-top: 1px solid var(--line); }
.front-meta h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.front-meta .sub { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-top: 6px; color: var(--muted); font-size: .85rem; }
.front-meta .sub span:first-child { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hint { flex: none; font-size: .78rem; display: inline-flex; align-items: center; gap: 5px; }
.ico { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }

.back-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px 12px; border-bottom: 1px solid var(--line); background: var(--paper-2); }
.back-head svg.mini { width: 40px; height: 52px; flex: none; }
.back-head .t { flex: 1; min-width: 0; }
.back-head h3 { font-family: var(--f-display); font-size: 1.25rem; margin: 0; line-height: 1.1; overflow-wrap: anywhere; }
.back-head .sub { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.label { text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; font-weight: 700; color: var(--muted); }
.back-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 8px; overscroll-behavior: contain; }
.back-body h4 { margin: 0 0 6px; }
.ing { list-style: none; margin: 0 0 16px; padding: 0; }
.ing li { display: grid; grid-template-columns: 4.8em 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .95rem; }
.ing li:last-child { border-bottom: 0; }
.frac { font-family: var(--f-body); font-size: 1.35em; line-height: 1; vertical-align: -0.06em; margin: 0 .04em; }
.amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .86rem; color: var(--accent); white-space: nowrap; }
.steps { margin: 0 0 14px; padding-left: 1.3em; font-size: .93rem; }
.steps li { padding: 3px 0; }
.tip { margin: -6px 0 14px; font-style: italic; font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .88rem; margin: 0 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.note { font-size: .88rem; margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.edited { font-size: .75rem; color: var(--muted); margin: 0 0 8px; }
.back-foot { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
.btn-quiet { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; }
.btn-quiet:hover { background: var(--paper-2); color: var(--ink); }

.check { border: 1px solid color-mix(in srgb, var(--danger) 45%, var(--line)); background: color-mix(in srgb, var(--danger) 7%, var(--paper)); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; }
.check .label { color: var(--danger); }
.check ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .86rem; }
.check li { padding: 2px 0; overflow-wrap: anywhere; }
.ver { display: inline-block; font: 700 .64rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 2px 8px; margin-bottom: 6px; }
.back-head .ver { margin: 0 4px 0 0; padding: 1px 6px; font-size: .58rem; }
.grid .front-meta .ver { font-size: .55rem; padding: 1px 6px; margin-bottom: 4px; }
.fav { position: absolute; top: 6px; right: 6px; z-index: 2; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.fav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
.fav[aria-pressed="true"] { color: var(--accent); }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.fav:hover { background: var(--paper-2); }
.status .actions { display: flex; gap: 8px; }
.surprise { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.surprise svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.card.picked .face { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.check-dot { position: absolute; bottom: 10px; right: 10px; font: 700 .66rem var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent); border-radius: 999px; padding: 3px 8px; background: var(--paper); }
.empty { text-align: center; padding: 56px 16px; color: var(--muted); max-width: 30rem; margin: 0 auto; }
.empty svg { width: 120px; height: 150px; margin-bottom: 8px; }
.empty strong { display: block; font-family: var(--f-display); font-size: 1.5rem; color: var(--ink); margin-bottom: 6px; }
.empty p { margin: 0 0 16px; }

/* Sketched glassware */
.sk { fill: none; stroke: var(--ink); stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.sk2 { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linecap: round; opacity: .45; }
.sk-soft { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; opacity: .38; }

/* ====================== END OF RECIPES ====================== */

// ---------- Sketched glassware (viewBox 0 0 120 160, all resting on y≈150) ----------
const GLASSES = {
  coupe: { name: "Coupe",
    main: ["M20 54 C22 82 42 94 60 94 C78 94 98 82 100 54", "M20 54 C40 49 80 49 100 54", "M58 94 C59 112 59 130 58 145", "M62 94 C61 112 61 130 62 145", "M36 149 C46 143 74 143 84 149 C72 152 48 152 36 149"],
    soft: ["M28 64 C46 68 74 68 92 64", "M88 70 L84 76", "M84 78 L80 83"] },
  wine: { name: "Wine glass",
    main: ["M34 18 C29 56 32 84 60 92 C88 84 91 56 86 18", "M34 18 C50 14 70 14 86 18", "M58 92 L58 145", "M62 92 L62 145", "M38 149 C48 143 72 143 82 149 C70 152 50 152 38 149"],
    soft: ["M33 52 C50 56 70 56 87 52", "M80 30 L79 40", "M81 44 L80 54"] },
  collins: { name: "Collins",
    main: ["M40 12 L42 148", "M80 12 L78 148", "M40 12 C52 9 68 9 80 12", "M42 148 C54 151 66 151 78 148", "M42 139 C54 142 66 142 78 139"],
    soft: ["M41 34 C53 37 67 37 79 34", "M72 50 L72 66", "M73 74 L73 92", "M73 100 L73 116"] },
  dof: { name: "Double old fashioned",
    main: ["M26 70 L31 148", "M94 70 L89 148", "M26 70 C46 65 74 65 94 70", "M31 148 C50 151 70 151 89 148", "M30 134 C50 138 70 138 90 134"],
    soft: ["M28 92 C48 96 72 96 92 92", "M84 100 L83 112", "M84 116 L83 126", "M44 104 L56 104 L56 116 L44 116 Z"] },
  gibraltar: { name: "Gibraltar (4 oz)",
    main: ["M36 88 L41 148", "M84 88 L79 148", "M36 88 C50 84 70 84 84 88", "M41 148 C54 151 66 151 79 148", "M40 137 C53 140 67 140 80 137"],
    soft: ["M39 116 C52 119 68 119 81 116", "M50 137 L49 117", "M60 138 L60 118", "M70 137 L71 117", "M37 100 C51 103 69 103 83 100"] },
  shot: { name: "Shot",
    main: ["M45 104 L48 148", "M75 104 L72 148", "M45 104 C55 101 65 101 75 104", "M48 148 C56 150 64 150 72 148", "M47 134 C55 137 65 137 73 134"],
    soft: ["M46 116 C55 119 65 119 74 116", "M69 120 L69 128"] },
};
GLASSES.bottle = { name: "Prep",
  main: ["M52 14 L68 14 L68 24 L52 24 Z", "M53 24 L53 46 C53 54 40 58 39 72 L38 146", "M67 24 L67 46 C67 54 80 58 81 72 L82 146", "M38 146 C50 150 70 150 82 146"],
  soft: ["M39 84 C52 87 68 87 81 84", "M44 98 L76 98 L76 126 L44 126 Z", "M50 108 L70 108", "M50 115 L64 115", "M76 60 L74 72"] };
const GLASS_ORDER = ["coupe", "wine", "collins", "dof", "gibraltar", "shot"];

function glassSVG(type, cls){
  const g = GLASSES[type] || GLASSES.coupe;
  const main = g.main.map(d => `<path class="sk" d="${d}"/>`).join("");
  const ghost = g.main.map(d => `<path class="sk2" d="${d}" transform="translate(.9 .6)"/>`).join("");
  const soft = g.soft.map(d => `<path class="sk-soft" d="${d}"/>`).join("");
  return `<svg class="${cls || ""}" viewBox="0 0 120 160" role="img" aria-label="${g.name}"><g filter="url(#sketch)">${soft}${ghost}${main}<path class="sk-soft" d="M30 154 L90 154" stroke-dasharray="6 5"/></g></svg>`;
}

// ---------- Amounts ----------
const UNIT_WORDS = { oz:"oz", ounce:"oz", ounces:"oz", ml:"ml", dash:"dash", dashes:"dash", drop:"drop", drops:"drop",
  barspoon:"barspoon", barspoons:"barspoon", bsp:"barspoon", tsp:"tsp", tbsp:"tbsp", leaf:"leaf", leaves:"leaf", pinch:"pinch",
  sleeve:"sleeve", sleeves:"sleeve", slice:"slice", slices:"slice", sprig:"sprig", sprigs:"sprig",
  cup:"cup", cups:"cup", g:"g", quart:"quart", quarts:"quart", liter:"liter", liters:"liter", lb:"lb", lbs:"lb", can:"can", cans:"can" };
const PLURAL = { dash:"dashes", leaf:"leaves", pinch:"pinches", oz:"oz", ml:"ml", tsp:"tsp", tbsp:"tbsp", g:"g", lb:"lb" };
const FRAC = { 0: "", 0.125: "⅛", 0.25: "¼", 0.375: "⅜", 0.5: "½", 0.625: "⅝", 0.75: "¾", 0.875: "⅞" };
const VULGAR = { "¼": ".25", "½": ".5", "¾": ".75", "⅓": ".333", "⅔": ".667" };

function toNumber(s){
  s = s.trim().replace(/(\d)\s*([¼½¾⅓⅔])/g, (_, d, f) => String(+d + +VULGAR[f])).replace(/^[¼½¾⅓⅔]$/, f => VULGAR[f]);
  let m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  const n = Number(s); return Number.isFinite(n) ? n : null;
}
// "1 1/2 oz Bourbon" -> { a: 1.5, u: "oz", i: "Bourbon" }; anything else is shown as written.
function parseLine(line){
  const m = String(line).trim().match(/^((?:\d+\s+\d+\/\d+)|(?:\d+\/\d+)|(?:\d*\.?\d+-\d*\.?\d+)|(?:\d*\.?\d+\s*[¼½¾⅓⅔]?)|[¼½¾⅓⅔])\s*([a-zA-Z]+\.?)?\s+(.+)$/);
  if (m){
    const a = toNumber(m[1]), uw = (m[2] || "").toLowerCase().replace(".", "");
    const u = m[2] && UNIT_WORDS[uw] ? UNIT_WORDS[uw] : "", i = m[2] && !u ? m[2] + " " + m[3] : m[3];
    if (a != null) return { a, u, i };
    return { raw: m[1] + (u ? " " + (PLURAL[u] || u + "s") : ""), i };
  }
  const t = String(line).trim().match(/^(top|rinse|float|spritz)\s+(?:with\s+)?(.+)$/i);
  if (t) return { word: t[1][0].toUpperCase() + t[1].slice(1).toLowerCase(), i: t[2] };
  return { i: String(line).trim() };
}
function fmtNum(n){ return Number.isInteger(n) ? String(n) : String(+n.toFixed(2)); }
function ozText(n){
  const r = Math.round(n * 8) / 8;
  if (Math.abs(r - n) > 0.01) return fmtNum(n);
  const w = Math.floor(r), f = FRAC[r - w];
  return (w ? w : (f ? "" : "0")) + f;
}
// Fraction glyphs render small in the mono face, so set them larger in the body face.
function amtHTML(x){ return esc(amountText(x)).replace(/[¼½¾⅛⅜⅝⅞]/g, f => `<span class="frac">${f}</span>`); }
function amountText(x){
  if (x.word) return x.word;
  if (x.raw) return x.raw;
  if (x.a == null) return "";
  if (x.u === "oz") return state.unit === "ml" ? `${Math.round(x.a * 30 / 5) * 5 || fmtNum(x.a * 30)} ml` : `${ozText(x.a)} oz`;
  if (x.u === "ml") return state.unit === "oz" ? `${ozText(Math.round(x.a / 30 * 4) / 4)} oz` : `${fmtNum(x.a)} ml`;
  if (!x.u) return fmtNum(x.a);
  return `${fmtNum(x.a)} ${x.a === 1 ? x.u : (PLURAL[x.u] || x.u + "s")}`;
}

// ---------- State ----------
const prefs = {
  get(k, d){ try { const v = localStorage.getItem("codex:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("codex:" + k, JSON.stringify(v)); } catch {} },
};
const state = { q: "", section: "All", view: prefs.get("view", "deck"), unit: prefs.get("unit", "oz"), flipped: new Set(), favs: new Set(prefs.get("favs", [])) };
const favKey = r => r.name.toLowerCase() + (r.version && r.version !== "A" ? "#" + r.version : "");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON_FLIP = `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>`;

const slug = t => String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const DRINKS = RECIPES.map(r => ({
  id: slug(r.name) + (r.version ? "-" + r.version.toLowerCase() : "") + (r.section === "Prep" || r.section === "Batches" ? "-prep" : ""),
  name: String(r.name || "Untitled"),
  section: String(r.section || ""),
  glass: GLASSES[r.glass] ? r.glass : "coupe",
  method: String(r.method || ""),
  ice: String(r.ice || ""),
  garnish: String(r.garnish || ""),
  ing: (r.ingredients || []).map(parseLine).filter(x => x.i),
  steps: (r.steps || []).map(String).filter(Boolean),
  tips: (r.tips || []).map(String).filter(Boolean),
  notes: String(r.notes || ""),
  checks: (r.checks || []).map(String).filter(Boolean),
  version: String(r.version || ""),
}));
const VCOUNT = {};
for (const r of DRINKS) VCOUNT[r.name.toLowerCase()] = (VCOUNT[r.name.toLowerCase()] || 0) + 1;
const vText = r => r.version ? `Version ${r.version} of ${VCOUNT[r.name.toLowerCase()]}` : "";
const COMPARE = "Compare versions";
const CHECK = "Needs checking";
const FAV = "Favorites";
const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>`;

function sections(){
  const m = new Map();
  for (const r of DRINKS) if (r.section) m.set(r.section, (m.get(r.section) || 0) + 1);
  return [...m.entries()];
}
function matches(r){
  if (state.section === CHECK){ if (!r.checks.length) return false; }
  else if (state.section === COMPARE){ if (!r.version) return false; }
  else if (state.section === FAV){ if (!state.favs.has(favKey(r))) return false; }
  else if (state.section !== "All" && r.section !== state.section) return false;
  if (!state.q) return true;
  const hay = [r.name, r.section, r.method, r.ice, r.garnish, GLASSES[r.glass].name, r.notes, ...r.ing.map(x => x.i)].join(" ").toLowerCase();
  return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}
function specLine(r){
  return r.ing.map(x => x.i.replace(/\s*\(.*?\)\s*/g, " ").trim()).filter(Boolean).slice(0, 4).join(" · ");
}

function cardHTML(r){
  const prep = r.glass === "bottle";
  const facts = prep ? [] : [["Glass", GLASSES[r.glass].name]];
  if (r.method && !prep) facts.push(["Method", r.method]);
  if (!prep) facts.push(["Ice", r.ice || "None (up)"]);
  if (r.garnish) facts.push(["Garnish", r.garnish]);
  return `<article class="card${state.flipped.has(r.id) ? " flipped" : ""}" data-id="${r.id}">
    <div class="card-inner">
      <div class="face front" role="button" tabindex="0" aria-label="${esc(r.name)}. Show the spec." data-flip>
        <button class="fav" data-fav aria-pressed="${state.favs.has(favKey(r))}" aria-label="Favorite ${esc(r.name)}">${STAR}</button>
        <div class="pic">${r.checks.length ? `<span class="check-dot" title="Needs checking">Check</span>` : ""}${r.section ? `<span class="section-tag">${esc(r.section)}</span>` : ""}${glassSVG(r.glass)}<span class="glass-name">${prep ? (r.method === "Batch" ? "Batch" : "Prep recipe") : esc(GLASSES[r.glass].name)}</span></div>
        <div class="front-meta">
          ${r.version ? `<span class="ver">${vText(r)}</span>` : ""}
          <h2>${esc(r.name)}</h2>
          <div class="sub"><span>${esc(specLine(r))}</span><span class="hint">${ICON_FLIP}Spec</span></div>
        </div>
      </div>
      <div class="face back" data-flip>
        <div class="back-head">${glassSVG(r.glass, "mini")}<div class="t"><h3>${esc(r.name)}</h3><div class="sub">${r.version ? `<span class="ver">${vText(r)}</span> ` : ""}${esc(r.section)}</div></div></div>
        <div class="back-body">
          ${r.method === "Batch" ? `<p class="note">Batch recipe, per liter unless noted.</p>` : ""}
          <h4 class="label">Ingredients</h4>
          <ul class="ing">${r.ing.map(x => `<li><span class="amt">${amtHTML(x)}</span><span>${esc(x.i)}</span></li>`).join("")}</ul>
          ${r.steps.length ? `<h4 class="label">${prep ? "Steps" : "Method"}</h4><ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>` : ""}
          ${r.tips.map(t => `<p class="tip">${esc(t)}</p>`).join("")}
          ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
          ${r.checks.length ? `<div class="check"><h4 class="label">Check</h4><ul>${r.checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
          ${r.notes ? `<h4 class="label">Notes</h4><p class="note">${esc(r.notes)}</p>` : ""}
        </div>
        <div class="back-foot"><button class="btn-quiet" data-flip>${ICON_FLIP}${prep ? "Show bottle" : "Show glass"}</button></div>
      </div>
    </div>
  </article>`;
}

function renderChips(){
  const secs = sections();
  const nCheck = DRINKS.filter(r => r.checks.length).length;
  const nFav = DRINKS.filter(r => state.favs.has(favKey(r))).length;
  const all = [["All", DRINKS.length], [FAV, nFav], ...secs];
  const nVer = DRINKS.filter(r => r.version).length;
  if (nVer) all.push([COMPARE, nVer]);
  if (nCheck) all.push([CHECK, nCheck]);
  $("#chips").innerHTML = secs.length > 1 || nCheck ? all.map(([s, n]) =>
    `<button class="chip" data-section="${esc(s)}" aria-pressed="${state.section === s}">${s === FAV ? "★ " : ""}${esc(s === "All" ? "All drinks" : s)}<span class="n">${n}</span></button>`).join("") : "";
}

function render(){
  const main = $("#cards");
  const list = DRINKS.filter(matches).sort((a, b) => a.name.localeCompare(b.name) || a.version.localeCompare(b.version));
  const total = DRINKS.length;
  $("#shown").textContent = list.length === total ? `${total} recipe${total === 1 ? "" : "s"}` : `${list.length} of ${total} recipes`;
  $("#deck-nav").hidden = state.view !== "deck" || list.length < 2;
  if (!list.length){
    main.className = "";
    main.innerHTML = state.section === FAV && !state.q
      ? `<div class="empty">${glassSVG("coupe")}<strong>No favorites yet</strong><p>Tap the star on any card to save it here. Favorites stay on this phone.</p></div>`
      : `<div class="empty">${glassSVG("dof")}<strong>No drinks match</strong><p>Try another word, or switch the filter back to All drinks.</p></div>`;
    return;
  }
  main.className = state.view === "deck" ? "deck" : "grid";
  main.innerHTML = list.map(cardHTML).join("");
  main.scrollLeft = 0;
  updatePos();
}
function updatePos(){
  const main = $("#cards"), cards = main.querySelectorAll(".card");
  if (state.view !== "deck" || !cards.length) return;
  const step = cards.length > 1 ? cards[1].offsetLeft - cards[0].offsetLeft : 1;
  $("#pos").textContent = `${Math.min(cards.length, Math.round(main.scrollLeft / step) + 1)} / ${cards.length}`;
}

// ---------- Events ----------
function setPressed(a, b, on){ $(a).setAttribute("aria-pressed", on); $(b).setAttribute("aria-pressed", !on); }
$("#q").addEventListener("input", e => {
  const was = state.q;
  state.q = e.target.value.trim();
  // A new search looks through every drink; tap a tab afterwards to narrow it.
  if (!was && state.q && state.section !== "All"){ state.section = "All"; renderChips(); }
  render();
});
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-section]"); if (!b) return; state.section = b.dataset.section; renderChips(); render(); });
$("#v-deck").addEventListener("click", () => { state.view = "deck"; prefs.set("view", "deck"); setPressed("#v-deck", "#v-grid", true); render(); });
$("#v-grid").addEventListener("click", () => { state.view = "grid"; prefs.set("view", "grid"); setPressed("#v-deck", "#v-grid", false); render(); });
$("#u-oz").addEventListener("click", () => { state.unit = "oz"; prefs.set("unit", "oz"); setPressed("#u-oz", "#u-ml", true); render(); });
$("#u-ml").addEventListener("click", () => { state.unit = "ml"; prefs.set("unit", "ml"); setPressed("#u-oz", "#u-ml", false); render(); });
$("#cards").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const fav = e.target.closest("[data-fav]");
  if (fav){
    const r = DRINKS.find(d => d.id === card.dataset.id), k = favKey(r);
    state.favs.has(k) ? state.favs.delete(k) : state.favs.add(k);
    prefs.set("favs", [...state.favs]);
    fav.setAttribute("aria-pressed", state.favs.has(k));
    renderChips();
    if (state.section === FAV) render();
    return;
  }
  if (!e.target.closest("[data-flip]")) return;
  card.classList.toggle("flipped");
  card.classList.contains("flipped") ? state.flipped.add(card.dataset.id) : state.flipped.delete(card.dataset.id);
});
$("#cards").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".front")){ e.preventDefault(); e.target.click(); }
});
$("#cards").addEventListener("scroll", updatePos, { passive: true });
function scrollByCard(dir){
  const main = $("#cards"), c = main.querySelectorAll(".card");
  const step = c.length > 1 ? c[1].offsetLeft - c[0].offsetLeft : main.clientWidth;
  main.scrollBy({ left: dir * step, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
$("#surprise").addEventListener("click", () => {
  let cards = [...$("#cards").querySelectorAll(".card")];
  if (!cards.length){
    state.q = ""; $("#q").value = ""; state.section = "All"; renderChips(); render();
    cards = [...$("#cards").querySelectorAll(".card")];
  }
  const card = cards[Math.floor(Math.random() * cards.length)];
  const smooth = matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
  document.querySelectorAll(".card.picked").forEach(c => c.classList.remove("picked"));
  card.classList.add("picked");
  if (state.view === "deck"){
    const main = $("#cards");
    main.scrollTo({ left: card.offsetLeft - main.firstElementChild.offsetLeft, behavior: smooth });
    main.scrollIntoView({ block: "nearest", behavior: smooth });
  } else {
    card.scrollIntoView({ block: "center", behavior: smooth });
  }
});
$("#prev").addEventListener("click", () => scrollByCard(-1));
$("#next").addEventListener("click", () => scrollByCard(1));

setPressed("#v-deck", "#v-grid", state.view === "deck");
setPressed("#u-oz", "#u-ml", state.unit === "oz");
renderChips();
render();
</script>
